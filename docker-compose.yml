# SAFAR — local/production-like stack.
# Copy .env.example to .env and set SECRET_KEY and POSTGRES_PASSWORD before
# running. `docker compose up --build` starts PostgreSQL, the API and the web
# app. Demo seed data is OFF by default here: never seed demo accounts into a
# production database.
services:
  db:
    # Plain PostgreSQL 16: SAFAR does not use PostGIS or other extensions.
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: safar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: safar
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safar -d safar"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql+psycopg://safar:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/safar
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (see .env.example)}
      RELEASE: ${RELEASE:-safar-1.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SAFAR_SEED: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1}
      # Secure cookies require HTTPS. For a local http-only trial set
      # COOKIE_SECURE=false and understand the risk.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-240}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
      COMPANION_RATE_LIMIT_PER_MINUTE: ${COMPANION_RATE_LIMIT_PER_MINUTE:-20}
      UPLOAD_RATE_LIMIT_PER_MINUTE: ${UPLOAD_RATE_LIMIT_PER_MINUTE:-30}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-26214400}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      # Optional error monitoring. Without a DSN this is a no-op.
      SENTRY_DSN: ${SENTRY_DSN:-}
      RETENTION_SESSION_DAYS: ${RETENTION_SESSION_DAYS:-30}
      RETENTION_INVITATION_DAYS: ${RETENTION_INVITATION_DAYS:-30}
      RETENTION_COMPANION_DAYS: ${RETENTION_COMPANION_DAYS:-30}
      RETENTION_NOTIFICATION_DAYS: ${RETENTION_NOTIFICATION_DAYS:-180}
      RETENTION_AUDIT_DAYS: ${RETENTION_AUDIT_DAYS:-365}
      RETENTION_OFFLINE_DAYS: ${RETENTION_OFFLINE_DAYS:-7}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/storage
    ports:
      - "8000:8000"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
  media:
